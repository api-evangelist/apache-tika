aid: apache-tika
name: Apache Tika
description: >-
  Apache Tika is a toolkit for detecting and extracting metadata and structured text content from over 1,000 file
  formats including PDF, Microsoft Office (Word, Excel, PowerPoint), OpenDocument, HTML, XML, images, audio, video, and
  archive formats. Tika provides a REST API server, Java library, and command-line tool. It is used by Apache Solr,
  Apache Nutch, and many other systems for content extraction and indexing. It is maintained by the Apache Software
  Foundation.
